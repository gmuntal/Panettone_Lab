<!doctype html>
<html lang="ca">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#174c42"><link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v={{ app_version }}"><link rel="icon" href="/static/icons/favicon.ico?v={{ app_version }}"><title>Accés · Panettone Lab · v{{ app_version }}</title><link rel="stylesheet" href="/static/app.css?v={{ app_version }}"></head>
<body class="login-page"><main class="login-card"><img class="brand-mark logo" src="/static/icons/icon-192.png?v={{ app_version }}" alt="Logotip de Panettone Lab"><p class="eyebrow">PANETTONE LAB, BY GMUNTAL</p><h1>Bon dia, forner/a</h1><p class="muted">Inicia sessió per veure la fermentació.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><label>Usuari<input name="username" autocomplete="username" required autofocus></label><label>Contrasenya<input name="password" type="password" autocomplete="current-password" required></label><button class="primary full" type="submit">Entrar</button></form><p class="tiny muted">Les dades es queden a la teva xarxa local.</p><p class="tiny muted">v{{ app_version }}</p></main></body></html>
